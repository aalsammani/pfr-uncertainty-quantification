[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfr_uq"
version = "1.0.0"
description = "Verified finite-volume solver and uncertainty quantification for the axial-dispersion (advection-dispersion-reaction) reactor model with Danckwerts boundary conditions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Mohammed A. Y. Mohammed" },
  { name = "Alsadig Ali" },
  { name = "Abdallah Alsammani" },
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.15",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "sympy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
